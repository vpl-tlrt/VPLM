name: VPLM mobile sheet viewport regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/vehicle-parking-location-management/**'
      - '.github/workflows/vplm-sheet-viewport-verify-temp.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vehicle-parking-location-management/package-lock.json
      - run: npm ci
        working-directory: apps/vehicle-parking-location-management
      - name: TypeScript and production build
        run: npm run build
        working-directory: apps/vehicle-parking-location-management
      - name: Half-offscreen modal regression test
        run: node scripts/verify-parking-sheet-position.mjs
        working-directory: apps/vehicle-parking-location-management
      - name: Parking conflict, bay and X Parking regression tests
        run: node scripts/verify-workspace-recovery.mjs
        working-directory: apps/vehicle-parking-location-management
      - name: Offline recovery safety regression tests
        run: node scripts/verify-workspace-recovery-status.mjs
        working-directory: apps/vehicle-parking-location-management
