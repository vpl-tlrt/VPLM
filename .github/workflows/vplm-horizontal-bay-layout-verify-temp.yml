name: VPLM horizontal bay layout verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/vehicle-parking-location-management/**'
      - '.github/workflows/vplm-horizontal-bay-layout-verify-temp.yml'
permissions:
  contents: read
jobs:
  build-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vehicle-parking-location-management/package-lock.json
      - run: npm ci
        working-directory: apps/vehicle-parking-location-management
      - name: Typecheck and production build
        run: npm run build
        working-directory: apps/vehicle-parking-location-management
      - name: Conflict and X Parking invariants
        run: node scripts/verify-workspace-recovery.mjs
        working-directory: apps/vehicle-parking-location-management
      - name: Verify lane pairing, X alignment and unchanged event handlers
        working-directory: apps/vehicle-parking-location-management
        run: |
          node -e 'const fs=require("fs"),a=require("assert"),t=fs.readFileSync("src/components/parking-app.tsx","utf8");for(const x of ["vplm-oriented-horizontal-scroll","lanePairs.map","lane === '\''Top'\''","lane === '\''Bottom'\''","renderXParkingSpace(bay)","renderBay(bay, index)","setSelectedXParkingBayId(bay.id)","setDraggedVehicleId","onDrop","vplm-oriented-road"])a(t.includes(x),x);a(!t.includes("renderXParkingSpaces(bays)")); console.log("PASS oriented Top/Bottom/X layout with original bay event hooks");'
