name: VPLM Supra launcher restoration verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/vehicle-parking-location-management/**'
      - '.github/workflows/vplm-supra-launcher-verify-temp.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vehicle-parking-location-management/package-lock.json
      - run: npm ci
        working-directory: apps/vehicle-parking-location-management
      - name: Production build
        run: npm run build
        working-directory: apps/vehicle-parking-location-management
      - name: Supra launcher interaction and asset verification
        run: node scripts/verify-supra-launcher-flow.mjs
        working-directory: apps/vehicle-parking-location-management
      - name: Parking and X occupancy regression
        run: node scripts/verify-workspace-recovery.mjs
        working-directory: apps/vehicle-parking-location-management
      - name: Offline data protection regression
        run: node scripts/verify-workspace-recovery-status.mjs
        working-directory: apps/vehicle-parking-location-management
